<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SLatest Posts</title>

    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #333;

            background-image: url("bg3.jpg");
        }


        .container {
            width: 95%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 0;
        }


    
        .title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 40px;
        }



        .cards {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 20px;
        }



        .card {
            background: white;

            text-align: center;

            border: 1px solid #eeeeee;

            border-radius: 4px;

            overflow: hidden;

            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);

            transition: 0.3s;
        }



        .card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.15);
        }


        .card img {
            width: 100%;
            height: 210px;

            object-fit: cover;

            display: block;
        }



        .card-content {
            padding: 15px 15px 20px;
        }


        

        .card-content h2 {
            font-size: 18px;

            font-weight: normal;

            margin-bottom: 10px;
        }



        .card-content p {
            color: #777;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 15px;
        }


        .read-btn {
            display: inline-block;

            padding: 10px 22px;

            background: #1976d2;

            color: white;

            text-decoration: none;

            font-size: 12px;

            font-weight: bold;

            border-radius: 3px;

            transition: 0.3s;
        }


        .read-btn:hover {
            background: #125ca8;
        }



        @media (max-width: 800px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .card img {
                height: 190px;
            }
        }


        @media (max-width: 550px) {

            .container {
                width: 90%;
                padding: 25px 0;
            }

            .title {
                font-size: 20px;

                margin-bottom: 25px;
            }

            .cards {
                grid-template-columns: 1fr;

                gap: 25px;
            }

            .card img {
                height: 220px;
            }

            .card-content h2 {
                font-size: 18px;
            }

            .card-content p {
                font-size: 14px;
            }
        }

    </style>
</head>


<body>


    <div class="container">


        <!-- Page Title -->

        <h1 class="title">
            What's New?
        </h1>


        <div class="cards">



            <div class="card">

                <img
                    src="w1.jpg"
                    alt="What"
                >

                <div class="card-content">

                    <h2>
                        WHAT?
                    </h2>

                    <p>
                        In What you will now your answers by answering 
                        by Yes or No.
                    </p>

                    <a href="#" class="read-btn">
                        READ
                    </a>

                </div>

            </div>



            <!-- CARD 2 -->

            <div class="card">

                <img
                    src="w2.jpg"
                    alt="Why"
                >

                <div class="card-content">

                    <h2>
                       WHY?
                    </h2>

                    <p>
                        In WHY you will know your unanswered question
                        by using why.
                    </p>

                    <a href="#" class="read-btn">
                        READ
                    </a>

                </div>

            </div>



            <!-- CARD 3 -->

            <div class="card">

                <img
                    src="h1.jpg"
                    alt="How"
                >

                <div class="card-content">

                    <h2>
                        HOW?
                    </h2>

                    <p>
                        In HOW you can know the thing that that possibly 
                        happen by using the word how.
                    </p>

                    <a href="#" class="read-btn">
                        READ
                    </a>

                </div>

            </div>


        </div>

    </div>


</body>
</html>
